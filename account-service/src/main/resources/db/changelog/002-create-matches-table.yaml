databaseChangeLog:
  - changeSet:
      id: 002-create-matches-table
      author: Ihsan Guldur
      changes:
        - createTable:
            tableName: matches
            columns:
              - column:
                  name: session_id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: played_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false