syntax = "proto3";
package match_arena.v1;

option go_package = "github.com/ihsanguldur/match-arena/game-service/internal/gen/match_arena/v1;matcharenav1";
option java_package = "com.matcharena.grpc.v1";
option java_multiple_files = true;

message JoinQueueRequest {
  string player_id = 1;
  int32 rating = 2;
}

message MatchFound {
  string session_id = 1;
  repeated string player_ids = 2;
}

message JoinQueueUpdate {
  oneof update {
    string queue_ticket_id = 1;
    MatchFound match_found = 2;
  }
}

message LeaveQueueRequest {
  string queue_ticket_id = 1;
}

message LeaveQueueResponse {
  bool success = 1;
}

service MatchmakingService {
  rpc JoinQueue(JoinQueueRequest) returns (stream JoinQueueUpdate);
  rpc LeaveQueue(LeaveQueueRequest) returns (LeaveQueueResponse);
}