syntax = "proto3";
package match_arena.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ihsanguldur/match-arena/game-service/internal/gen/match_arena/v1;matcharenav1";
option java_package = "com.matcharena.grpc.v1";
option java_multiple_files = true;

message PlayerAction {
  string player_id = 1;
  string session_id = 2;
  string action_type = 3;
  google.protobuf.Timestamp client_timestamp = 4;
}

message PlayerScore {
  string player_id = 1;
  int32 score = 2;
}

message AntiCheatFlag {
  string player_id = 1;
  string rule = 2;
  string detail = 3;
}

message SessionUpdate {
  string session_id = 1;
  repeated PlayerScore scores = 2;
  repeated AntiCheatFlag flags = 3;
  bool session_ended = 4;
}

service GameSessionService {
  rpc PlayGame(stream PlayerAction) returns (stream SessionUpdate);
}