services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: match_arena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  account-service:
    build:
      context: ./account-service
    environment:
      DB_HOST: postgres
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Plain `echo > /dev/tcp/...` writes a byte into the socket, which gRPC's
      # HTTP/2 handler logs as a "corrupt preface" exception on every check.
      # Open and close the fd without writing anything instead.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9090 && exec 3<&-'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  game-service:
    build:
      context: ./game-service
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis:6379
      ACCOUNT_SERVICE_ADDR: account-service:9090
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "9091:9091"
    depends_on:
      redis:
        condition: service_healthy
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9091"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./game-service
      dockerfile: Dockerfile.gateway
    environment:
      GAME_SERVICE_ADDR: game-service:9091
      ACCOUNT_SERVICE_HTTP_ADDR: http://account-service:8080
      WEB_CLIENT_DIR: /client/web
    volumes:
      - ./client/web:/client/web:ro
    ports:
      - "8081:8081"
    depends_on:
      game-service:
        condition: service_healthy
      account-service:
        condition: service_healthy

volumes:
  postgres_data:
